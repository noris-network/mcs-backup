name: ci

on:
  push:
    branches: [main, v2]
  pull_request: {}
  workflow_call: {}
  workflow_dispatch: {}
  schedule:
    # picks up new restic releases
    - cron: "11 1 * * *"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet and go fix
        run: |
          go vet ./...
          test -z "$(go fix -diff ./...)"

      # the linter has to be built with the Go version of the module
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: goinstall
          args: --build-tags integration

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build for all platforms
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            echo "== $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/mcs-backup
          done
          GOOS=darwin go vet ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            restic: 0.17.3 # the minimum supported version
          - os: ubuntu-latest
            restic: 0.20.0 # the version in the image
            s3: true
          - os: macos-latest
            restic: brew
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install restic and rest-server (Linux)
        if: runner.os == 'Linux'
        env:
          RESTIC_VERSION: ${{ matrix.restic }}
          REST_SERVER_VERSION: 0.14.0
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2" | bunzip2 > "$RUNNER_TEMP/bin/restic"
          curl -fsSL "https://github.com/restic/rest-server/releases/download/v${REST_SERVER_VERSION}/rest-server_${REST_SERVER_VERSION}_linux_amd64.tar.gz" \
            | tar -xzO --wildcards '*/rest-server' > "$RUNNER_TEMP/bin/rest-server"
          chmod +x "$RUNNER_TEMP/bin/restic" "$RUNNER_TEMP/bin/rest-server"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install restic and rest-server (macOS)
        if: runner.os == 'macOS'
        env:
          REST_SERVER_VERSION: 0.14.0
        run: |
          arch=$([ "${{ runner.arch }}" = ARM64 ] && echo arm64 || echo amd64)
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/restic/rest-server/releases/download/v${REST_SERVER_VERSION}/rest-server_${REST_SERVER_VERSION}_darwin_${arch}.tar.gz" \
            | tar -xzO "rest-server_${REST_SERVER_VERSION}_darwin_${arch}/rest-server" > "$RUNNER_TEMP/bin/rest-server"
          chmod +x "$RUNNER_TEMP/bin/rest-server"
          brew install restic
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # the S3 tests drive the TUI and the web UI with real data; Silo is the
      # S3 server of the local tests too (MinIO has withdrawn its images)
      - name: Start an S3 server
        if: matrix.s3
        run: |
          docker run -d --name s3 -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=mcs-backup-ci -e MINIO_ROOT_PASSWORD=mcs-backup-ci-secret \
            pgsty/silo:RELEASE.2026-11-12T00-00-00Z server /data
          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:9000/minio/health/live
          {
            echo "MCS_TEST_S3_ENDPOINT=http://127.0.0.1:9000"
            echo "MCS_TEST_S3_ACCESS_KEY=mcs-backup-ci"
            echo "MCS_TEST_S3_SECRET_KEY=mcs-backup-ci-secret"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: Integration tests
        run: |
          RESTIC_BIN=$(command -v restic) REST_SERVER_BIN=$(command -v rest-server) \
            go test -tags integration -race -count=1 ./internal/integration/

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # builds both architectures to catch Dockerfile problems before a release
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

      # runs the image the way the docs describe it: any user, read-only root
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: mcs-backup:smoke
          build-args: VERSION=smoke

      - name: Smoke test of the image
        run: scripts/image-smoke.sh mcs-backup:smoke

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the examples and the docs
        run: scripts/docs-check.sh

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Known vulnerabilities in the code paths of the module
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # fuzzing takes time: nightly and by hand only
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # a failing input is printed in the log; add it to testdata/fuzz of its package
      - name: Fuzz every target for a minute
        run: scripts/fuzz.sh 60s
